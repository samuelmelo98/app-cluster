apiVersion: v1
kind: ConfigMap
metadata:
  name: string-messaging-config
  namespace: prod
data:
  HTTP_PORT: "8082"

  DB_URL: "jdbc:postgresql://postgres-service.bancos.svc.cluster.local:5432/string_messaging"

  REDIS_URL: "redis://redis.prod.svc.cluster.local:6379"

  KAFKA_BOOTSTRAP_SERVERS: "kafka-cluster-kafka-bootstrap.prod.svc.cluster.local:9092"
  MESSAGING_EVENTS_TOPIC: "string.messaging.events.v1"

  OIDC_TENANT_ENABLED: "true"
  OIDC_AUTH_SERVER_URL: "https://auth.stringtecnologiadf.org/realms/stringtecnologia"
  OIDC_CLIENT_ID: "string-messaging-platform"
  QUARKUS_OIDC_APPLICATION_TYPE: "service"

  WHATSAPP_GRAPH_URL: "https://graph.facebook.com"
  WHATSAPP_GRAPH_VERSION: "v25.0"
  WHATSAPP_VERIFY_SIGNATURE: "true"

  HIBERNATE_LOG_SQL: "false"
  QUARKUS_SWAGGER_UI_ALWAYS_INCLUDE: "false"
