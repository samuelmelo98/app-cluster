apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: string-messaging
  namespace: prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik

  rules:
    - host: messaging.cluster.stringtecnologiadf.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: string-messaging
                port:
                  number: 80
