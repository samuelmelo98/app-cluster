apiVersion: apps/v1
kind: Deployment
metadata:
  name: string-messaging
  namespace: prod
  labels:
    app: string-messaging
spec:
  replicas: 1

  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: string-messaging

  template:
    metadata:
      labels:
        app: string-messaging

    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: string-messaging
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8082
              protocol: TCP

        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_USER
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-secret
              key: MINIO_ROOT_PASSWORD
          envFrom:
            - configMapRef:
                name: string-messaging-config

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: string-messaging-secret
                  key: db-user

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: string-messaging-secret
                  key: db-password

            - name: WHATSAPP_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: string-messaging-secret
                  key: whatsapp-access-token

            - name: WHATSAPP_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: string-messaging-secret
                  key: whatsapp-app-secret

            - name: WHATSAPP_WEBHOOK_VERIFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: string-messaging-secret
                  key: whatsapp-webhook-verify-token

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: REDIS_PASSWORD

          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      terminationGracePeriodSeconds: 30
