apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocr-engine
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: ocr-engine

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: paddle-worker
  namespace: prod
spec:
  podSelector:
    matchLabels:
      app: paddle-worker

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ocr-engine
      ports:
        - protocol: TCP
          port: 8000
