apiVersion: v1
kind: ConfigMap
metadata:
  name: ocr-engine-config
  namespace: prod
data:
  QUARKUS_HTTP_HOST: "0.0.0.0"
  QUARKUS_HTTP_PORT: "8080"

  OCR_WORKER_URL: "http://paddle-worker:8000"
  OCR_WORKER_TIMEOUT_SECONDS: "180"
  OCR_MAX_BYTES: "20971520"

  OCR_ROTATE: "true"
  OCR_MIN_CONFIDENCE: "0.35"
  OCR_MAX_PIXELS: "30000000"

  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
