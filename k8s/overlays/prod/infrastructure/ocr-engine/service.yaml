apiVersion: v1
kind: Service
metadata:
  name: ocr-engine
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: ocr-engine
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: paddle-worker
  namespace: prod
spec:
  type: ClusterIP
  selector:
    app: paddle-worker
  ports:
    - name: http
      port: 8000
      targetPort: http
