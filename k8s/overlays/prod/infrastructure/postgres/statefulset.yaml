apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: postgres
  namespace: bancos

spec:
  serviceName: postgres
  replicas: 1

  podManagementPolicy: OrderedReady
  revisionHistoryLimit: 10

  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              value: meu_banco

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 0

  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: postgres-storage

    spec:
      accessModes:
        - ReadWriteOnce

      resources:
        requests:
          storage: 5Gi

      volumeMode: Filesystem
