apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dados-filebrowser
  namespace: prod
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: prod-dados-filebrowser-https@kubernetescrd

spec:
  ingressClassName: traefik

  rules:
    - host: dados.cluster.stringtecnologiadf.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dados-filebrowser
                port:
                  number: 80
