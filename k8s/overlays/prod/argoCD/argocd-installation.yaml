apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-installation
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/samuelmelo98/app-cluster.git
    targetRevision: main
    path: k8s/platform/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
