apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ocr-engine
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/samuelmelo98/app-cluster.git
    targetRevision: main
    path: k8s/overlays/prod/infrastructure/ocr-engine

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
