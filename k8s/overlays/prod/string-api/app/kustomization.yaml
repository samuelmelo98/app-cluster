apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../base
  - documentos-pvc.yaml

namePrefix: string-api-

replicas:
  - count: 1
    name: app

labels:
  - includeSelectors: true
    pairs:
      app: string-api

patches:

  # =========================================================
  # INGRESS
  # =========================================================
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: string-api.cluster.stringtecnologiadf.org
    target:
      kind: Ingress
      name: app

  # =========================================================
  # DEPLOYMENT - PORTA + VARIAVEIS DE AMBIENTE
  # =========================================================
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/ports/0/containerPort
        value: 8080

      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: SPRING_PROFILES_ACTIVE
            value: prod

          - name: URL
            valueFrom:
              secretKeyRef:
                name: string-api-secret
                key: infosimples-url

          - name: KEY
            valueFrom:
              secretKeyRef:
                name: string-api-secret
                key: infosimples-key

          - name: USUARIO
            valueFrom:
              secretKeyRef:
                name: string-api-secret
                key: db-user

          - name: SENHA
            valueFrom:
              secretKeyRef:
                name: string-api-secret
                key: db-pass

          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: string-api-secret
                key: redis-password

          - name: NAME_SERVER
            valueFrom:
              secretKeyRef:
                name: string-api-secret
                key: name-server

          - name: PORT
            valueFrom:
              secretKeyRef:
                name: string-api-secret
                key: name-port

          # =================================================
          # STRING EMAILS
          # =================================================
          - name: STRING_EMAIL_URL
            value: "http://string-email:8080"

          - name: STRING_EMAIL_CLIENT_ID
            value: "string-api-email"

          - name: STRING_EMAIL_TOKEN_URL
            value: "https://auth.stringtecnologiadf.org/realms/stringtecnologia/protocol/openid-connect/token"

          - name: STRING_EMAIL_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: string-api-secret
                key: string-email-client-secret

                     # =================================================
          # TESTE STRING EMAILS
          # =================================================
          - name: APP_EMAIL_TEST_ENABLED
            value: "false"

          - name: APP_EMAIL_TEST_TO
            value: "samuelmelo98@hotmail.com"
    target:
      kind: Deployment
      name: app

  # =========================================================
  # DEPLOYMENT - LIBERA ACESSO A STRING-EMAILS VIA NETWORKPOLICY
  # =========================================================
  - patch: |-
      - op: add
        path: /spec/template/metadata/labels/string-email-client
        value: "true"
    target:
      kind: Deployment
      name: app

  # =========================================================
  # DEPLOYMENT - PVC DOCUMENTOS
  # =========================================================
  - patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: documentos
            persistentVolumeClaim:
              claimName: string-api-documentos-pvc

      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: documentos
            mountPath: /data/documentos
    target:
      kind: Deployment
      name: app

  # =========================================================
  # SERVICE - TARGET PORT
  # =========================================================
  - patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8080
    target:
      kind: Service
      name: app

  # =========================================================
  # SERVICE - SELECTOR
  # =========================================================
  - patch: |-
      - op: replace
        path: /spec/selector/app
        value: string-api
    target:
      kind: Service
      name: app
